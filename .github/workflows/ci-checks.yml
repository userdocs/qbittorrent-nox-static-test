name: ci - checks
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sh-checker:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the sh-checker
        id: sh-checker
        uses: luizm/action-sh-checker@883217215b11c1fabbf00eb1a9a041f62d74c744 # v0.10.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHELLCHECK_OPTS: -e SC2034,SC1091 # It is possible to exclude some shellcheck warnings.
          SHFMT_OPTS: -ci -sr -i 0 # It is possible to pass arguments to shftm
        with:
          sh_checker_comment: true
          sh_checker_exclude: ""

      - name: Write summary
        if: always()
        env:
          STEP_OUTCOME: ${{ steps.sh-checker.outcome }}
        run: |
          {
            printf '### Shell Checker (`shellcheck` + `shfmt`)\n\n'
            printf '| Check | Result | Options |\n'
            printf '| :--- | :---: | :--- |\n'
            printf '| `sh-checker` | `%s` | `SHELLCHECK_OPTS="-e SC2034,SC1091"`, `SHFMT_OPTS="-ci -sr -i 0"` |\n' "${STEP_OUTCOME}"
          } >> "${GITHUB_STEP_SUMMARY}"

  zizmor-checker:
    runs-on: ubuntu-26.04-arm
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        id: zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2

      - name: Write summary
        if: always()
        env:
          STEP_OUTCOME: ${{ steps.zizmor.outcome }}
        run: |
          {
            printf '### Zizmor Security Audit\n\n'
            printf '| Check | Result |\n'
            printf '| :--- | :---: |\n'
            printf '| `zizmor` | `%s` |\n' "${STEP_OUTCOME}"
          } >> "${GITHUB_STEP_SUMMARY}"

  editorconfig-checker:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: editorconfig-checker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          runner_arch: ${{ runner.arch }}
        run: |
          case "${runner_arch}" in
            X86 | X64)
              arch="amd64"
              ;;
            ARM | ARM64)
              arch="arm64"
              ;;
          esac

          curl -Lo- "https://github.com/editorconfig-checker/editorconfig-checker/releases/latest/download/editorconfig-checker-linux-${arch}.tar.gz" | tar xzf -
          ec_log="$(mktemp)"
          trap 'rm -f -- "${ec_log}"' EXIT
          set +e
          ./editorconfig-checker --exclude '^(docs/.*|patches/.*)$' | sed 's/\x1b\[[0-9;]*m//g' | tee "${ec_log}"
          exit_code="${PIPESTATUS[0]}"
          set -e
          {
            printf '### EditorConfig Checker\n\n'
            printf '| Check | Exit Code |\n'
            printf '| :--- | :---: |\n'
            printf '| `editorconfig-checker` | `%s` |\n\n' "${exit_code}"
            if [[ -s "${ec_log}" ]]; then
              printf '```text\n'
              cat "${ec_log}"
              printf '```\n'
            else
              printf 'No formatting issues found.\n'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          # exit "${exit_code}"
